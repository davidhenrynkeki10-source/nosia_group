<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1600 900" preserveAspectRatio="none" color-interpolation="sRGB">
  <defs>
    <!-- Vertical color bands gradient running from left to right (x1=0 to x2=1, constant y) -->
    <linearGradient id="srgb-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8C8C8" />
      <stop offset="14.2857%" stop-color="#9A9A9A" />
      <stop offset="28.5714%" stop-color="#6B6B6B" />
      <stop offset="42.8571%" stop-color="#2D2D2D" />
      <stop offset="57.1429%" stop-color="#3A3A3A" />
      <stop offset="71.4286%" stop-color="#484848" />
      <stop offset="85.7143%" stop-color="#7A7A7A" />
      <stop offset="100%" stop-color="#8A8A8A" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#srgb-gradient)" />
</svg>
